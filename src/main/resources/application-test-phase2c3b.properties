# =============================================================================
# PET CARE SHOP - PHASE 2C.3B TEST PROFILE CONFIGURATION
# Activated via: --spring.profiles.active=test-phase2c3b
# Points to isolated test database: petshop_phase2c3b_test
# =============================================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/petshop_phase2c3b_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:petshop_user}
spring.datasource.password=${DB_PASSWORD:petshop_pwd_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep database schema intact (NO auto-alteration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Prevent automatic initialization of scripts on startup
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Prevent sending real emails during automated testing
spring.mail.host=127.0.0.1
spring.mail.port=2525
